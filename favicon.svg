<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A Capture Cube: red top half, white bottom half, black band and a white button. -->
  <g stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round">
    <polygon points="32,4 58,18 32,32 6,18" fill="#ef4a4a"/>
    <polygon points="6,18 32,32 32,46 6,32" fill="#b92b2b"/>
    <polygon points="32,32 58,18 58,32 32,46" fill="#d63434"/>
    <polygon points="6,32 32,46 32,60 6,46" fill="#cfcfcf"/>
    <polygon points="32,46 58,32 58,46 32,60" fill="#f4f4f4"/>
  </g>
  <polyline points="6,32 32,46 58,32" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="41,37 49,32.7 49,41 41,45.3" fill="#fff" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
